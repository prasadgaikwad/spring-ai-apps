name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v5

      - name: Set up Temurin 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compile all modules
        run: ./mvnw -B -DskipTests compile

      - name: Verify enforce rules and declared dependencies
        # Enforcer is bound to `validate`; dependency:analyze reports (without failing on)
        # starter-transitive APIs that are intentionally consumed by the demos.
        run: ./mvnw -B -DskipTests validate dependency:analyze

      - name: Test without Docker-dependent RAG integration tests
        # Tests tagged `docker` provision a PGVector Testcontainers instance. They are
        # excluded here and run in the separate Docker-enabled job below.
        run: |
          echo "Skipping tests tagged 'docker': they require a Docker daemon."
          ./mvnw -B test \
            -DexcludedGroups=docker \
            -Dsurefire.failIfNoSpecifiedTests=false

  docker-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v5

      - name: Set up Temurin 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run RAG integration tests with Docker
        run: |
          ./mvnw -B -pl ai-rag -am test \
            -Dgroups=docker \
            -Dsurefire.failIfNoSpecifiedTests=false
