name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Temurin 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compile all modules
        run: ./mvnw -B -DskipTests compile

      - name: Test without Docker-dependent RAG integration tests
        # DocumentIngestionIntegrationTests and RagQueryIntegrationTests provision a
        # PGVector Testcontainers instance. They are excluded here and remain runnable
        # locally or in the separate Docker-enabled verification job below.
        run: |
          echo "Skipping DocumentIngestionIntegrationTests and RagQueryIntegrationTests: they require a Docker daemon."
          ./mvnw -B test \
            -Dtest='!DocumentIngestionIntegrationTests,!RagQueryIntegrationTests' \
            -Dsurefire.failIfNoSpecifiedTests=false

  docker-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Temurin 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run RAG integration tests with Docker
        run: ./mvnw -B -pl ai-rag -am test \
          -Dtest='DocumentIngestionIntegrationTests,RagQueryIntegrationTests' \
          -Dsurefire.failIfNoSpecifiedTests=false
