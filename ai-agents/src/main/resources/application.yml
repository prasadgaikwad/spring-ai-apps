spring:
  application:
    name: ai-agents
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2}
    openai:
      api-key: ${OPENAI_API_KEY:not-configured}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:not-configured}
    mcp:
      server:
        enabled: false
        name: spring-ai-agents-mcp
        version: 0.1.0

spring.profiles.default: ollama

---
spring:
  config:
    activate:
      on-profile: openai
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}

---
spring:
  config:
    activate:
      on-profile: anthropic
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: ${ANTHROPIC_CHAT_MODEL:claude-3-5-haiku-20241022}
