spring:
  application:
    name: ai-decision

ai:
  decision:
    provider: jev
    base-url: ${JEV_BASE_URL:https://api.typesafe.ai}
    api-key: ${JEV_API_KEY:${TYPESAFE_API_KEY:${SYSTEMONE_API_KEY:}}}
    model: ${JEV_MODEL:jev-latest}
    timeout: 10s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
